<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월곶 이레하이니스 - 오션 정보</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="styles/ocean.css?v=2.7">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌊 월곶 이레하이니스</h1>
            <div class="subtitle">입주자가 매일 확인하는 월곶 포구 오션 브리핑</div>
            <div class="building-info">실시간 조수 · 일출/일몰 · 오늘의 조망 포인트</div>
            <button class="refresh-btn" onclick="loadOceanData(true)">🔄 정보 새로고침</button>
        </div>

        <div id="oceanContainer">
            <div class="loading">오션 정보를 불러오는 중...</div>
        </div>

        <section class="resident-info-card stop-map-card">
            <div class="bus-card-header">
                <div>
                    <div class="section-kicker">정류소 위치</div>
                    <h2>이레하이니스 주변 정류소</h2>
                </div>
                <div class="bus-badge">이미지 안내</div>
            </div>
            <img class="stop-map-image" src="assets/ire-bus-stops-map.svg?v=6" alt="월곶 이레하이니스 주변 풍림아파트상가와 월곶포구 정류소 위치 안내 지도">
        </section>

        <section id="busInfoCard" class="resident-info-card bus-info-card">
            <div class="bus-card-header">
                <div>
                    <div class="section-kicker">교통 정보</div>
                    <h2>이레하이니스 주변 버스</h2>
                </div>
                <div class="bus-badge">불러오는 중</div>
            </div>
            <p class="bus-note">상·하행 주변 정류소의 경기도 버스 도착 정보를 확인하고 있습니다.</p>
        </section>
    </div>

    <script src="js/ocean.js?v=2.9"></script>
</body>
</html>
