<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">월곶 이레하이니스 주변 정류소 위치</title>
  <desc id="desc">실제 지도 이미지 위에 월곶 이레하이니스와 주변 버스 정류소 3곳을 표시한 안내 이미지</desc>
  <defs>
    <filter id="pinShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0b2538" flood-opacity="0.28"/>
    </filter>
    <filter id="labelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b2538" flood-opacity="0.22"/>
    </filter>
    <style>
      .label{font-family:Pretendard,Arial,sans-serif;font-weight:900;fill:#123b5d}
      .sub{font-family:Pretendard,Arial,sans-serif;font-weight:800;fill:#5d7280}
      .badge{font-family:Pretendard,Arial,sans-serif;font-weight:950;fill:white}
    </style>
  </defs>

  <image href="ire-nearby-map-base.jpg" x="0" y="0" width="1200" height="800" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1200" height="800" fill="rgba(255,255,255,0.08)"/>

  <!-- Building marker -->
  <g filter="url(#pinShadow)">
    <path d="M565 545c0-21 17-38 38-38s38 17 38 38c0 32-38 73-38 73s-38-41-38-73z" fill="#ef4444"/>
    <circle cx="603" cy="545" r="19" fill="#fff" opacity=".96"/>
    <text x="603" y="552" text-anchor="middle" font-family="Arial" font-size="22" font-weight="900" fill="#ef4444">⌂</text>
  </g>
  <g filter="url(#labelShadow)">
    <rect x="504" y="621" width="198" height="46" rx="15" fill="white" opacity=".96"/>
    <text x="603" y="650" text-anchor="middle" class="label" font-size="20">월곶 이레하이니스</text>
  </g>

  <!-- Stop 1: north/upper stop visible on the map -->
  <g filter="url(#pinShadow)">
    <circle cx="994" cy="20" r="18" fill="#0ea5e9"/>
    <rect x="977" y="3" width="34" height="34" rx="10" fill="#0ea5e9"/>
    <text x="994" y="25" text-anchor="middle" class="badge" font-size="18">B</text>
  </g>
  <g filter="url(#labelShadow)">
    <rect x="778" y="42" width="244" height="62" rx="16" fill="white" opacity=".96"/>
    <text x="798" y="68" class="label" font-size="18">정류소 1</text>
    <text x="798" y="91" class="sub" font-size="14">월곶해안로 상단 방면</text>
  </g>

  <!-- Stop 2: right/center stop -->
  <g filter="url(#pinShadow)">
    <circle cx="1054" cy="438" r="19" fill="#2563eb"/>
    <rect x="1036" y="420" width="36" height="36" rx="10" fill="#2563eb"/>
    <text x="1054" y="443" text-anchor="middle" class="badge" font-size="18">B</text>
  </g>
  <g filter="url(#labelShadow)">
    <rect x="815" y="454" width="266" height="68" rx="16" fill="white" opacity=".96"/>
    <text x="835" y="481" class="label" font-size="18">정류소 2</text>
    <text x="835" y="505" class="sub" font-size="14">나드리 지역아동센터 인근</text>
  </g>

  <!-- Stop 3: lower/right stop -->
  <g filter="url(#pinShadow)">
    <circle cx="1044" cy="577" r="19" fill="#0891b2"/>
    <rect x="1026" y="559" width="36" height="36" rx="10" fill="#0891b2"/>
    <text x="1044" y="582" text-anchor="middle" class="badge" font-size="18">B</text>
  </g>
  <g filter="url(#labelShadow)">
    <rect x="785" y="596" width="285" height="68" rx="16" fill="white" opacity=".96"/>
    <text x="805" y="623" class="label" font-size="18">정류소 3</text>
    <text x="805" y="647" class="sub" font-size="14">윤슬동물병원 인근</text>
  </g>

  <g filter="url(#labelShadow)">
    <rect x="34" y="34" width="386" height="74" rx="20" fill="white" opacity=".94"/>
    <text x="58" y="66" class="label" font-size="22">실제 지도 기반 정류소 위치</text>
    <text x="58" y="93" class="sub" font-size="15">건물 기준 가까운 정류소 3곳을 표시했습니다.</text>
  </g>
</svg>
