<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">월곶 이레하이니스 주변 정류소 위치</title>
  <desc id="desc">지도 원본 위에 가까운 버스 정류소 세 곳을 작은 번호로 표시한 이미지</desc>
  <defs>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0b2538" flood-opacity="0.28"/>
    </filter>
    <style>
      .num{font-family:Pretendard,Arial,sans-serif;font-weight:950;fill:white}
      .legend-title{font-family:Pretendard,Arial,sans-serif;font-size:18px;font-weight:950;fill:#123b5d}
      .legend-text{font-family:Pretendard,Arial,sans-serif;font-size:14px;font-weight:800;fill:#536b7a}
    </style>
  </defs>

  <image href="ire-nearby-map-base.jpg" x="0" y="0" width="1200" height="800" preserveAspectRatio="xMidYMid slice"/>

  <!-- minimal overlay only: keep the real map readable -->
  <g filter="url(#shadow)">
    <circle cx="604" cy="568" r="17" fill="#ef4444"/>
    <text x="604" y="574" text-anchor="middle" class="num" font-size="17">집</text>
  </g>

  <!-- 1: northern stop visible near top-right -->
  <g filter="url(#shadow)">
    <circle cx="995" cy="17" r="18" fill="#0ea5e9"/>
    <text x="995" y="24" text-anchor="middle" class="num" font-size="19">1</text>
  </g>

  <!-- 2: center-right stop -->
  <g filter="url(#shadow)">
    <circle cx="1052" cy="437" r="18" fill="#2563eb"/>
    <text x="1052" y="444" text-anchor="middle" class="num" font-size="19">2</text>
  </g>

  <!-- 3: lower-right stop -->
  <g filter="url(#shadow)">
    <circle cx="1044" cy="577" r="18" fill="#0891b2"/>
    <text x="1044" y="584" text-anchor="middle" class="num" font-size="19">3</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="28" y="612" width="452" height="154" rx="20" fill="white" opacity="0.94"/>
    <text x="54" y="646" class="legend-title">주변 정류소 3곳</text>
    <text x="54" y="678" class="legend-text">1 · 월곶해안로 상단 정류소</text>
    <text x="54" y="708" class="legend-text">2 · 나드리 지역아동센터 인근 정류소</text>
    <text x="54" y="738" class="legend-text">3 · 윤슬동물병원 인근 정류소</text>
  </g>
</svg>
