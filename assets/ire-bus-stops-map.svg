<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">월곶 이레하이니스 주변 버스 정류소 좌표 기반 위치도</title>
  <desc id="desc">월곶동 1013-1 월곶 이레하이니스와 풍림아파트상가 상행, 풍림아파트상가 하행, 월곶포구 양방향 정류소를 실제 좌표 비율에 맞춰 분리 표시한 안내 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf7f4"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8ecff"/>
      <stop offset="1" stop-color="#5fb4d4"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#123b5d" flood-opacity="0.16"/>
    </filter>
    <style>
      .label{font-family:Pretendard,Arial,sans-serif;fill:#123b5d}
      .muted{font-family:Pretendard,Arial,sans-serif;fill:#60788a}
      .small{font-size:13px;font-weight:700}.mid{font-size:16px;font-weight:850}.title{font-size:20px;font-weight:950}
    </style>
  </defs>

  <rect width="920" height="560" rx="34" fill="url(#bg)"/>

  <!-- Approximate coastline / 월곶포구 water side, for orientation only -->
  <path d="M0 0h230c-24 58-48 117-45 188 3 75 42 123 40 191-2 69-45 124-86 181H0z" fill="url(#water)" opacity=".9"/>
  <path d="M232 26c-35 80-50 142-43 211 7 70 39 106 35 174-3 53-31 96-62 131" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity=".72"/>
  <text x="42" y="68" class="label title" fill="#0b5f78">월곶포구</text>
  <text x="42" y="92" class="muted small">해안 방향</text>

  <!-- Simplified road axes based on stop coordinate spread -->
  <path d="M210 438 C300 399 386 354 490 294 S685 177 845 104" fill="none" stroke="#d5e2e7" stroke-width="66" stroke-linecap="round"/>
  <path d="M210 438 C300 399 386 354 490 294 S685 177 845 104" fill="none" stroke="#fff" stroke-width="36" stroke-linecap="round"/>
  <path d="M220 432 C310 394 394 350 498 290 S690 174 838 108" fill="none" stroke="#93aeb9" stroke-width="3" stroke-dasharray="11 12" opacity=".62"/>

  <path d="M276 130 C358 190 434 251 515 320 S654 434 764 510" fill="none" stroke="#d5e2e7" stroke-width="48" stroke-linecap="round" opacity=".72"/>
  <path d="M276 130 C358 190 434 251 515 320 S654 434 764 510" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" opacity=".95"/>

  <!-- Distance rings around Ire Highness: schematic but scaled to coordinates -->
  <circle cx="287" cy="366" r="98" fill="none" stroke="#0f7895" stroke-width="2" stroke-dasharray="7 9" opacity=".32"/>
  <circle cx="287" cy="366" r="220" fill="none" stroke="#0f7895" stroke-width="2" stroke-dasharray="7 9" opacity=".22"/>
  <text x="304" y="462" class="muted small">약 200m권</text>
  <text x="392" y="523" class="muted small">약 450m권</text>

  <!-- Ire Highness marker: approximate coordinate 126.7342874, 37.3888537 -->
  <g filter="url(#shadow)">
    <circle cx="287" cy="366" r="21" fill="#0f7895"/>
    <circle cx="287" cy="366" r="7" fill="#fff"/>
    <rect x="164" y="300" width="246" height="50" rx="18" fill="#0f7895"/>
    <text x="287" y="331" text-anchor="middle" font-family="Pretendard,Arial,sans-serif" font-size="20" font-weight="950" fill="#fff">월곶 이레하이니스</text>
  </g>

  <!-- Stops plotted from GBIS coordinates relative to building estimate. -->
  <!-- 풍림아파트상가 25164: 126.73605,37.3896833 / about 162m -->
  <g filter="url(#shadow)">
    <circle cx="411" cy="263" r="18" fill="#2563eb"/>
    <text x="411" y="270" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#fff">↑</text>
    <rect x="436" y="216" width="274" height="86" rx="18" fill="#fff"/>
    <text x="456" y="244" class="label mid">풍림아파트상가 25164</text>
    <text x="456" y="268" class="muted small">상행 · 약 160m</text>
    <text x="456" y="288" class="muted small">배곧 / 오이도 / 강남 방면</text>
  </g>

  <!-- 풍림아파트상가 25162: 126.7361333,37.3899 / about 182m -->
  <g filter="url(#shadow)">
    <circle cx="417" cy="236" r="18" fill="#1d4ed8"/>
    <text x="417" y="243" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#fff">↓</text>
    <rect x="438" y="122" width="274" height="86" rx="18" fill="#fff"/>
    <text x="458" y="150" class="label mid">풍림아파트상가 25162</text>
    <text x="458" y="174" class="muted small">하행 · 약 180m</text>
    <text x="458" y="194" class="muted small">개봉 / 대야 / 인천 방면</text>
  </g>

  <!-- 월곶포구 25187: 126.7393667,37.3883667 / about 432m -->
  <g filter="url(#shadow)">
    <circle cx="642" cy="426" r="17" fill="#0891b2"/>
    <text x="642" y="433" text-anchor="middle" font-family="Arial" font-size="17" font-weight="900" fill="#fff">↑</text>
    <rect x="666" y="379" width="218" height="78" rx="18" fill="#fff"/>
    <text x="686" y="407" class="label mid">월곶포구 25187</text>
    <text x="686" y="431" class="muted small">포구 앞 · 약 430m</text>
  </g>

  <!-- 월곶포구 25188: 126.7396167,37.3885167 / about 452m -->
  <g filter="url(#shadow)">
    <circle cx="660" cy="408" r="17" fill="#0e7490"/>
    <text x="660" y="415" text-anchor="middle" font-family="Arial" font-size="17" font-weight="900" fill="#fff">↓</text>
    <rect x="658" y="294" width="218" height="78" rx="18" fill="#fff"/>
    <text x="678" y="322" class="label mid">월곶포구 25188</text>
    <text x="678" y="346" class="muted small">포구 앞 · 약 450m</text>
  </g>

  <path d="M307 357 C345 326 378 294 399 269" fill="none" stroke="#0f7895" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 10" opacity=".72"/>
  <path d="M307 374 C412 411 530 424 625 425" fill="none" stroke="#0f7895" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 10" opacity=".46"/>

  <g>
    <rect x="36" y="446" width="272" height="76" rx="20" fill="#fff" opacity=".92"/>
    <text x="58" y="476" class="label mid">좌표 기반 간이 위치도</text>
    <text x="58" y="501" class="muted small">GBIS 정류소 좌표와 건물 추정 좌표 기준</text>
  </g>
</svg>
